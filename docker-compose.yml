services:
  postgres:
    image: postgres:16-alpine
    container_name: analytics-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - analytics-network

  backend:
    build: ./backend
    container_name: analytics-backend
    ports:
      - "5001:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://admin:password@postgres:5432/analytics?schema=public
      # DEV ONLY - override with real secrets (see backend/.env.example)
      JWT_SECRET: ${JWT_SECRET:-dev-only-access-secret-change-me-0123456789}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me-012345678}
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
    depends_on:
      - postgres
    networks:
      - analytics-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time; the browser calls the API through the host port.
        VITE_API_URL: http://localhost:5001
    container_name: analytics-frontend
    ports:
      - "3000:3000"
    networks:
      - analytics-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  analytics-network:
    driver: bridge
