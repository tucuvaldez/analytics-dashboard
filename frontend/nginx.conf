server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths (e.g. /dashboards/123) are handled by React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
